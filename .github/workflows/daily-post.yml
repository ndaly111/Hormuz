name: Morning Bluesky post

# First daily Bluesky post — top news cluster + war-range chart.
# Split off from daily-refresh.yml 2026-07-17: the fetch stays at 06:00 UTC
# so the site is fresh early, but posting at 06:00 UTC (2am ET) reached
# nobody. 12:30 UTC = 8:30am ET, when the US audience is awake.
#
# Posts only when the 06:00 refresh committed new data today (same rule as
# before the split). force_post overrides, e.g. to recover a failed post.

on:
  schedule:
    # 12:30 UTC = 8:30am ET / 1:30pm UK.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post even if no new data was committed today"
        required: false
        default: "false"
        type: choice
        options: [ "false", "true" ]
      dry_run_post:
        description: "Render image + log caption, but skip actual Bluesky post"
        required: false
        default: "false"
        type: choice
        options: [ "false", "true" ]
      share_range:
        description: "Chart range for the post"
        required: false
        default: "war"
        type: choice
        options: [ "d7", "d30", "closure", "war", "all" ]

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether today's refresh committed new data
        id: gate
        run: |
          if ! git log --since "$(date -u +%Y-%m-%d)T00:00:00Z" --oneline -- site/data/transits.json | grep -q .; then
            echo "No data commit today — skipping post."
            echo "post=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dedupe: skip if a morning post already went out today (e.g. a
          # manual force_post recovery run) — anything in the ledger before
          # 16:00 UTC that isn't a weekly recap counts.
          if python3 -c 'import json,sys;from datetime import datetime,timezone;e=json.load(open("pipeline/engagement_log.json"));t=datetime.now(timezone.utc).date().isoformat();sys.exit(1 if any(x["ts"][:10]==t and int(x["ts"][11:13])<16 and x.get("kind")!="weekly_recap" for x in e) else 0)'; then
            echo "Data commit found and no morning post yet today."
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "A morning post already exists in today's ledger — skipping."
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.post == 'true' || inputs.force_post == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.post == 'true' || inputs.force_post == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Install Playwright browser
        if: steps.gate.outputs.post == 'true' || inputs.force_post == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Post update to Bluesky
        if: steps.gate.outputs.post == 'true' || inputs.force_post == 'true'
        env:
          BLUESKY_HANDLE: hormuz-traffic.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.claude }}
          SHARE_RANGE_KEY: ${{ inputs.share_range || 'war' }}
        run: |
          if [ "${{ inputs.dry_run_post }}" = "true" ]; then
            python pipeline/post_bluesky.py --dry-run
          else
            python pipeline/post_bluesky.py
          fi

      - name: Commit ledger update (if changed)
        if: (steps.gate.outputs.post == 'true' || inputs.force_post == 'true') && inputs.dry_run_post != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/engagement_log.json
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            # Pull latest in case another workflow (e.g. fetch-engagement) ran
            # in the meantime and pushed to the ledger.
            git pull --rebase --autostash origin main || true
            git commit -m "Append post entry to engagement ledger $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload dry-run preview
        if: inputs.dry_run_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-dry-run-preview
          path: pipeline/_latest_share.png
          if-no-files-found: ignore
