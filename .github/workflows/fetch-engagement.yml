name: Fetch engagement metrics

on:
  schedule:
    # 12:00 UTC daily — gives the 06:00 UTC daily-refresh post a 6h head
    # start before fetcher first looks for it (it'll skip until 24h old).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-engagement
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch engagement
        run: python pipeline/fetch_engagement.py

      - name: Commit ledger updates (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/engagement_log.json
          if git diff --cached --quiet; then
            echo "No engagement changes to commit."
          else
            git commit -m "Update engagement metrics $(date -u +%Y-%m-%d)"
            git push
          fi
