name: Daily PortWatch refresh

# Fetches + commits data only. The morning Bluesky post moved to
# daily-post.yml (12:30 UTC) — engagement data showed 06:00 UTC posts
# (2am ET) reach nobody, while the site still wants fresh data early.

on:
  schedule:
    # Run every day at 06:00 UTC. PortWatch updates Tuesdays 13:00 UTC,
    # so a daily run keeps things fresh without missing the update.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        run: python pipeline/fetch_portwatch.py

      - name: News preview (Discord)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.Discord_webhook }}
          ANTHROPIC_API_KEY: ${{ secrets.claude }}
        run: python pipeline/news_review.py
        continue-on-error: true

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/transits.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily refresh: PortWatch data through $(date -u +%Y-%m-%d)"
            git push
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

