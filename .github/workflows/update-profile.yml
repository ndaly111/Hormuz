name: Update Bluesky profile

# One-shot: refreshes display name, bio, and the pinned explainer post.
# Manual dispatch only — run when the copy in pipeline/update_profile.py
# changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Update profile
        env:
          BLUESKY_HANDLE: hormuz-traffic.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python pipeline/update_profile.py
